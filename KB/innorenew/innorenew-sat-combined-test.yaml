        image: cloud-193-225-250-99.sztaki.science-cloud.hu/swarchestrate/innorenew/audio_classification@sha256:69d8f8316362534061942c9f316b50cf6ab18aaceea07fc80670bd7c44bf91ef
        replicas: 1
        resources:
          requests:
            cpu: "1"
        ports:
          - port: 42002
            targetPort: 42002
            containerPort: 42002
        volumes:
          - source: /home/gunjan/classification-conf/configuration.ini
            target: /app/configuration.ini
      requirements:
        - host:
            count: 3
            node_filter:
              $and:
                - $greater_or_equal:
                    - $get_property: [SELF, TARGET, CAPABILITY, host, num-cpus]
                    - 2
                - $greater_or_equal:
                    - $get_property: [SELF, TARGET, CAPABILITY, host, mem-size]
                    - 2
                - $equal:
                    - $get_property: [SELF, TARGET, CAPABILITY, resource, capacity-provider]
                    - innorenew
                - $equal:
                    - $get_property: [SELF, TARGET, CAPABILITY, resource, type]
                    - edge
      capabilities:
        metrics:
          properties:
            raw:

            # Raw CPU idle metric.
            # Required to calculate node_load.
            - name: cpu_idle_instance
              sensor: netdata
              config:
                scope_contexts: system.cpu
                dimensions: idle
              collection_frequency: 30 sec
              collection_output: all

            # Raw node temperature metric.
            # Required to calculate node_temp.
            # - name: node_temp_instance
            #   sensor: netdata
            #   config:
            #     scope_contexts: system.hw.sensor.temperature.input
            #     dimensions: input
            #   collection_frequency: 30 sec
            #   collection_output: all

            - name: cpu_util_instance
              # sensor: "Netdata"
              sensor: netdata
              config:
                scope_contexts: k8s.cgroup.cpu
              collection_frequency: "15 sec" #tbd
              collection_output: "all"

            composite:
            # Policy input:
            # array[1..sys_node_count_max] of float: node_load
            - name: node_load
              formula: 100 - mean(cpu_idle_instance)
              collection_frequency: 30 sec
              collection_output: all
              window_type: sliding
              window_size: 5 min
              grouping: per_instance

            # Policy input:
            # array[1..sys_node_count_max] of float: node_temp
            # - name: node_temp
            #   formula: max(node_temp_instance)
            #   collection_frequency: 30 sec
            #   collection_output: all
            #   window_type: sliding
            #   window_size: 5 min
            #   grouping: per_instance

            - name: mean_cpu_util
              formula: mean( cpu_util_instance )
              collection_frequency: "5 min" #tbd
              collection_output: "all"
              window_type: "sliding"
              window_size: "5 min"
              grouping: "global" #cpu avg across all edge nodes that run the audio-class microservice

        slo-constraints:
          properties:
            or_list:
              - name: mean_cpu_util_above_slo
                metric: mean_cpu_util
                operator: ">"
                threshold: 60.0
              - name: mean_cpu_util_below_slo
                metric: mean_cpu_util
                operator: "<"
                threshold: 30.0

