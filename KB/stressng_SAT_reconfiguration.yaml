tosca_definitions_version: tosca_2_0
description: stress-ng workload as a Swarmchestrate SAT - monitoring metrics plus a
  Reconfiguration policy (rule + constants) for the Optimiser; variant with monitoring-team
  supported metrics (testing; original KB SAT metrics are not EMS-provisioned)
metadata:
  name: stressng
  author: you
  date: '2026-05-05'
  version: 1.0
  tags:
  - stressng
imports:
- namespace: swch
  url: https://raw.githubusercontent.com/Swarmchestrate/tosca/refs/heads/main/profiles/eu.swarmchestrate/profile.yaml
service_template:
  node_templates:
    swarm:
      type: swch:Swarm
      directives:
      - substitute
    stressng:
      type: swch:Microservice
      properties:
        image: docker.io/gunjank05/stress-ng
        replicas: 1
        labels:
          app: stressng
          service: stressng
        command:
        - stress-ng
        args:
        - --cpu
        - '1'
        - --vm
        - '1'
        - --vm-bytes
        - 256M
        - --timeout
        - 3600s
        - --metrics-brief
        ports: []
      capabilities:
        metrics:
          properties:
            raw:
            - name: cpu_idle_instance
              sensor: netdata
              config:
                scope_contexts: system.cpu
                dimensions: idle
              collection_frequency: 30 sec
              collection_output: all
            - name: ram_free_instance
              sensor: netdata
              config:
                scope_contexts: system.ram
                dimensions: free
              collection_frequency: 30 sec
              collection_output: all
            - name: ram_total_instance
              sensor: netdata
              config:
                scope_contexts: system.ram
                results-aggregation: SUM
              collection_frequency: 30 sec
              collection_output: all
            - name: disk_read_activity
              sensor: netdata
              config:
                scope_contexts: system.io
                dimensions: reads
              collection_frequency: 10 sec
              collection_output: all
            - name: disk_write_activity
              sensor: netdata
              config:
                scope_contexts: system.io
                dimensions: writes
              collection_frequency: 10 sec
              collection_output: all
            composite:
            - name: cpu_util_prct
              formula: 100 - mean(cpu_idle_instance)
              collection_frequency: 30 sec
              collection_output: all
              window_type: sliding
              window_size: 5 min
              grouping: global
            - name: ram_util_prct
              formula: (mean(ram_total_instance)-mean(ram_free_instance))/mean(ram_total_instance)
              collection_frequency: 30 sec
              collection_output: all
              window_type: sliding
              window_size: 5 min
              grouping: global
            - name: avg_disk_utilization
              formula: abs(mean(disk_read_activity))+abs(mean(disk_write_activity))
              collection_frequency: 10 sec
              collection_output: all
              window_type: sliding
              window_size: 5 min
              grouping: global
        slo-constraints:
          properties:
            name: cpu_utilization
            metric: cpu_util_prct
            operator: '>'
            threshold: 80.0
      requirements:
      - host:
          count: 1
          node_filter:
            $and:
            - $greater_or_equal:
              - $get_property:
                - SELF
                - TARGET
                - CAPABILITY
                - host
                - num-cpus
              - 1
            - $greater_or_equal:
              - $get_property:
                - SELF
                - TARGET
                - CAPABILITY
                - host
                - mem-size
              - 2
  policies:
  - stressng_colocation:
      type: swch:Scheduling.Colocation
      targets: []
  # Reconfiguration policy: the Optimiser's rule and the constants it refers to.
  # Extracted by the Swarm Agent with the Sardou lib (get_reconfiguration).
  - stressng_reconfiguration:
      type: swch:Reconfiguration
      properties:
        constants:
          threshold_min_node_load: "40.0"
          threshold_max_node_load: "70.0"
        rule: |
          % --- system parameters: required by every rule ---
          int: sys_pod_count_max;
          int: sys_node_count_max;
          int: sys_node_count_actual;
          array[1..sys_pod_count_max] of int: sys_mapping_actual;
          var 1..sys_node_count_max: sys_node_count_next :: add_to_output;
          array[1..sys_pod_count_max] of var 0..sys_node_count_max: sys_mapping_next :: add_to_output;
          var 0..sys_pod_count_max: sys_pod_count_next =
            sum(p in 1..sys_pod_count_max)(sys_mapping_next[p] > 0);
          int: sys_pod_count_actual =
            sum(p in 1..sys_pod_count_max)(sys_mapping_actual[p] > 0);

          % --- application constants (from the SAT) ---
          float: threshold_min_node_load;
          float: threshold_max_node_load;

          % --- application parameters (one value per node) ---
          % Load per machine, not one figure for the whole cluster: a cluster
          % average hides the case this rule exists to handle, where one node is
          % saturated while another sits idle.
          array[1..sys_node_count_actual] of float: node_load;

          % --- derived ---
          % Average load over only the nodes that actually host a pod. Empty
          % nodes would drag the average down and hide a busy one.
          int: sys_node_count_used =
            sum(n in 1..sys_node_count_actual)
              (exists(p in 1..sys_pod_count_max)(sys_mapping_actual[p] = n));
          float: avg_load_on_used_nodes =
            if sys_node_count_used > 0 then
              sum(n in 1..sys_node_count_actual
                  where exists(p in 1..sys_pod_count_max)(sys_mapping_actual[p] = n))
                 (node_load[n]) / int2float(sys_node_count_used)
            else
              threshold_min_node_load
                + (threshold_max_node_load - threshold_min_node_load) / 2
            endif;

          % --- constraints ---
          % 1) never scale below one pod
          constraint sys_pod_count_next >= 1;

          % 2) at most two pods on any one node, so load has somewhere to spread
          constraint forall(n in 1..sys_node_count_max)
            (sum(p in 1..sys_pod_count_max)(bool2int(sys_mapping_next[p] = n)) <= 2);

          % 3) a pod sits on a real node, or nowhere
          constraint forall(p in 1..sys_pod_count_max)
            ((sys_mapping_next[p] = 0)
             \/ (sys_mapping_next[p] >= 1 /\ sys_mapping_next[p] <= sys_node_count_next));

          % 4) the node count is fixed: creating a machine is the Resource
          %    Agent's job, not the Swarm Agent's
          constraint sys_node_count_next = sys_node_count_actual;

          % 5) add a pod when the used nodes are above the upper threshold,
          %    while there is both a free slot and room on a node for it
          constraint (avg_load_on_used_nodes > threshold_max_node_load
                      /\ sys_pod_count_actual < sys_pod_count_max
                      /\ sys_pod_count_actual < sys_node_count_actual * 2) ->
            sys_pod_count_next > sys_pod_count_actual;

          % 6) remove a pod when they are below the lower threshold
          constraint (avg_load_on_used_nodes < threshold_min_node_load
                      /\ sys_pod_count_actual > 1) ->
            sys_pod_count_next < sys_pod_count_actual;

          % --- optimisation goal ---
          % Prefer the smallest change, then the fewest pods moved, then the
          % least loaded machines - so a new pod lands on a quiet node.
          var int: loss =
            100 * sum(p in 1..sys_pod_count_max)
                  (bool2int(sys_mapping_next[p] != sys_mapping_actual[p]))
            + 10 * abs(sys_pod_count_actual - sys_pod_count_next)
            + sum(p in 1..sys_pod_count_max where sys_mapping_next[p] > 0)
                 (round(node_load[sys_mapping_next[p]]));
          solve minimize loss;
      targets: [ stressng ]
