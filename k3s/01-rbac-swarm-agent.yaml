---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarm-agent
  namespace: swarm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarm-agent-role
rules:
  # Cluster-scoped read so the agent can check namespaces (fixes your 403)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Required so the agent can apply the Traefik HelmChartConfig (fixes the
  # "helmchartconfigs.helm.cattle.io is forbidden" 403 seen when applying
  # the ACME-enabled Traefik manifest generated by k3s_client).
- apiGroups: ["helm.cattle.io"]
  resources: ["helmcharts", "helmchartconfigs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Required for IngressRouteTCP resources used by traefik_tcp_routes.
- apiGroups: ["traefik.io"]
  resources: ["ingressroutes", "ingressroutetcps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swarm-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swarm-agent-role
subjects:
- kind: ServiceAccount
  name: swarm-agent
  namespace: swarm-system
---
